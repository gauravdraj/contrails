name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test contrails-core.test.js
      - run: npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/mcpsdk" @modelcontextprotocol/sdk@1.32.2
      - run: node --test worker/src/*.test.js
        env:
          MCP_SDK_DIR: ${{ runner.temp }}/mcpsdk
      - run: node --test scripts/healthcheck.test.mjs
      - run: node smoke-boot.mjs
      - run: python3 -m unittest discover -s relay -p 'test_*.py'
      - run: node scripts/browser-check.mjs
        timeout-minutes: 5
      - run: node scripts/watch-check.mjs
        timeout-minutes: 5
      - run: npx --yes wrangler@4 deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-out"
        working-directory: worker
