<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="application-name" content="Contrails">
<meta name="theme-color" content="#08111e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contrails">
<title>Contrails</title>
<link id="app-touch-icon" rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link id="app-favicon" rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="loading">
  <div id="loading-card">
    <div class="spinner"></div>
    <span id="loading-text">Getting location...</span>
    <div id="loading-actions" hidden>
      <div class="loading-note">Browse without live location, open a default view, or enter coordinates.</div>
      <div class="loading-row">
        <button id="loading-browse" class="loading-action" type="button">Open default view</button>
        <button id="loading-retry" class="loading-action ghost" type="button">Try location again</button>
      </div>
      <form id="loading-coordinates">
        <input id="loading-lat" class="loading-input" type="text" inputmode="decimal" placeholder="Latitude">
        <input id="loading-lng" class="loading-input" type="text" inputmode="decimal" placeholder="Longitude">
        <button class="loading-action" type="submit">Use coordinates</button>
      </form>
    </div>
  </div>
</div>
<div id="app">
  <div id="map"></div>
</div>
<div id="alert-bar"></div>
<div id="map-controls" class="collapsed">
  <button id="controls-toggle" type="button" aria-expanded="false" aria-controls="controls-body">
    <span id="controls-toggle-brand">
      <span id="controls-logo-shell" aria-hidden="true"><img id="controls-logo-image" src="contrails-logo.png" alt=""></span>
      <span id="controls-toggle-main">
        <span id="controls-toggle-heading"><span id="controls-toggle-label">Contrails</span><span id="version-badge"></span></span>
        <span id="controls-compact-summary">Browse the map</span>
      </span>
    </span>
    <span id="controls-toggle-icon" aria-hidden="true">+</span>
  </button>
  <div id="controls-body">
    <div id="controls-actions">
      <div id="search-shell">
        <input id="search-input" type="search" inputmode="search" placeholder="Search WN1234, SWA1234, or 4ca87c" autocomplete="off" spellcheck="false">
        <div id="search-results" role="listbox" hidden></div>
      </div>
    </div>
    <div id="controls-feedback" role="status" aria-live="polite"></div>
    <div class="control-row" id="visibility-controls">
      <button class="ftag on" data-f="private" aria-pressed="true">Private</button>
      <button class="ftag on" data-f="ground" aria-pressed="true">Ground</button>
      <button class="ftag on" data-f="trails" aria-pressed="true">Trails</button>
      <button class="ftag on" data-f="labels" aria-pressed="true">Labels</button>
    </div>
    <div class="control-row" id="feature-controls">
      <button id="toggle-weather" class="ftag" type="button" aria-pressed="false" title="Toggle weather radar (RainViewer)">Weather</button>
      <button id="toggle-follow" class="ftag" type="button" aria-pressed="false" title="Keep the map centered on the selected aircraft">Follow</button>
      <button id="toggle-places" class="ftag" type="button" aria-expanded="false" aria-controls="places-panel" title="Saved locations">Places</button>
    </div>
    <div id="places-panel" hidden>
      <div class="places-head">
        <span class="section-label">Saved places</span>
        <button id="places-save" type="button" class="places-save">+ Save current view</button>
      </div>
      <div id="places-list"></div>
    </div>
    <div id="controls-meta">
      <div class="section-label">Altitude</div>
      <div id="legend-gradient" aria-hidden="true"></div>
      <div id="legend-scale"><span>Low</span><span>High</span></div>
      <div id="reference-note">Using your live location for distance and bearing.</div>
      <div id="view-hint">Routes and labels appear when you zoom in.</div>
    </div>
  </div>
</div>
<div id="airport-panel" aria-hidden="true">
  <div id="airport-panel-sheet" role="dialog" aria-modal="false" aria-label="Airport traffic">
    <button id="airport-panel-close" type="button" aria-label="Close airport traffic">&times;</button>
    <div id="airport-panel-content"></div>
  </div>
</div>
<script src="contrails-core.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-doubletapdrag@0.1.2/Leaflet.DoubleTapDrag.js"></script>
<script src="https://unpkg.com/leaflet-doubletapdragzoom@0.3.2/Leaflet.DoubleTapDragZoom.js"></script>
<script src="https://unpkg.com/@luomus/leaflet-smooth-wheel-zoom@1.0.0/SmoothWheelZoom.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js"></script>
<!-- Classic scripts sharing one global scope: load order matters, boot.js last. -->
<script src="js/app-core.js"></script>
<script src="js/map.js"></script>
<script src="js/features.js"></script>
<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="js/geolocation.js"></script>
<script src="js/airport-board.js"></script>
<script src="js/controls.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
